  <style>
    :root{--bg:#050505;--text:#e5e7eb;--text-dim:#a1a1aa;--text-muted:#9ca3af;--teal:#2dd4bf;--border:rgba(255,255,255,0.05);--card:rgba(255,255,255,0.03);--gradient:radial-gradient(circle at top,#0d7377 0%,#050505 70%)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none;transition:color .2s}
    a:hover{color:var(--teal)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    *:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}

    .skip-link{position:absolute;top:-100%;left:0;background:var(--teal);color:#000;padding:.75rem 1.5rem;z-index:100;font-weight:700;border-radius:0 0 .5rem 0}
    .skip-link:focus{top:0}

    .site-nav{position:sticky;top:0;z-index:50;background:rgba(5,5,5,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:.75rem 0}
    .nav-inner{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
    .nav-logo{font-size:1.25rem;font-weight:700;letter-spacing:-.025em;color:#fff}
    .nav-links{display:none;gap:1.5rem;font-size:.875rem;font-weight:500;color:var(--text-dim)}
    .nav-links a:hover{color:var(--teal)}
    .nav-search{position:relative;flex-shrink:0}
    .nav-search input{background:#18181b;border:1px solid #27272a;border-radius:.5rem;padding:.5rem .75rem .5rem 2rem;color:#fff;font-size:.875rem;width:180px;transition:width .2s}
    .nav-search input:focus{width:220px;border-color:var(--teal);outline:none}
    .nav-search svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:#6b7280;pointer-events:none}
    @media(min-width:768px){.nav-links{display:flex}}
    @media(max-width:640px){.nav-search input{width:40px;padding:.5rem;transition:width .2s}.nav-search input:focus{width:180px;padding:.5rem .75rem .5rem 2rem}}

    #search-results{position:absolute;top:100%;right:0;left:0;background:#18181b;border:1px solid #27272a;border-radius:.5rem;margin-top:.25rem;max-height:300px;overflow-y:auto;z-index:60;display:none}
    #search-results.show{display:block}
    #search-results a{display:block;padding:.75rem 1rem;color:var(--text);font-size:.875rem;border-bottom:1px solid var(--border)}
    #search-results a:hover{background:rgba(45,212,191,0.1);color:#fff}
    #search-results .no-results{padding:1rem;color:var(--text-muted);font-size:.875rem}

    .hero{background:var(--gradient);padding:4rem 1.5rem 6rem;text-align:center}
    .hero-content{max-width:800px;margin:0 auto}
    .hero-badge{display:inline-block;background:rgba(45,212,191,.1);color:var(--teal);padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1rem}
    .hero-title{font-size:clamp(3rem,6vw,4.5rem);font-weight:700;letter-spacing:-.025em;line-height:1;margin:0 0 1.5rem;color:#fff}
    .hero-lead{font-size:1.25rem;color:#d4d4d8;line-height:1.75;margin-bottom:2.5rem;max-width:700px;margin-left:auto;margin-right:auto}
    .hero-buttons{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
    .btn{display:inline-block;padding:1rem 2.5rem;border-radius:.5rem;font-weight:700;text-align:center;transition:all .2s;cursor:pointer;border:none;font-size:1rem}
    .btn-primary{background:#14b8a6;color:#000}
    .btn-primary:hover{background:var(--teal)}
    .btn-secondary{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff}
    .btn-secondary:hover{background:rgba(255,255,255,0.1)}

    .role-section{padding:4rem 1.5rem;background:#000;border-top:1px solid var(--border)}
    .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;max-width:1200px;margin:0 auto}
    .role-card{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:2rem;transition:border-color .3s,transform .3s}
    .role-card:hover{border-color:rgba(45,212,191,0.2);transform:translateY(-3px)}
    .role-card h3{font-size:1.125rem;font-weight:700;margin-bottom:.5rem;color:#fff}
    .role-card p{color:var(--text-dim);font-size:.9375rem;line-height:1.6;margin-bottom:1.25rem}
    .role-card a{font-size:.875rem;font-weight:600;color:var(--teal);display:inline-flex;align-items:center;gap:.35rem}
    .role-card a::after{content:'→';transition:transform .2s}
    .role-card a:hover::after{transform:translateX(4px)}

    .stats-section{padding:5rem 1.5rem;background:#000}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;max-width:1200px;margin:0 auto}
    .stat-card{background:var(--card);border:1px solid rgba(45,212,191,0.1);border-radius:1rem;padding:1.5rem}
    .stat-label{color:var(--teal);font-family:monospace;font-size:.875rem;letter-spacing:.05em}
    .stat-value{font-size:1.875rem;font-weight:700;color:#fff;margin-top:.25rem}

    .ledger-section{padding:6rem 1.5rem;background:#09090b;border-top:1px solid var(--border)}
    .ledger-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2.5rem;max-width:1200px;margin:0 auto}
    .ledger-column h2{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:.5rem;letter-spacing:.08em}
    .matrix-link{border-left:1px solid rgba(255,255,255,0.05);padding-left:1rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center}
    .matrix-link a{display:block;font-size:1.125rem;font-weight:700;color:#fff;flex:1}
    .matrix-link span{font-size:.75rem;color:var(--text-dim);font-family:monospace;margin-right:1rem}
    .matrix-link::after{content:'❯';color:var(--teal);font-size:1.25rem;transition:transform .2s}
    .matrix-link:hover::after{transform:translateX(4px)}

    .spec-section{padding:5rem 1.5rem;border-top:1px solid var(--border)}
    .spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2.5rem;max-width:1200px;margin:0 auto;align-items:center}
    .spec-code{background:#18181b;border:1px solid rgba(255,255,255,0.1);border-radius:1rem;padding:2rem;font-family:ui-monospace,monospace;font-size:.875rem;color:#5eead4;line-height:1.7;overflow-x:auto}

    .section-header{max-width:1200px;margin:0 auto 3rem;padding:0 1.5rem}
    .section-header h2{font-size:clamp(1.75rem,4vw,2.5rem);font-weight:700;margin-bottom:1rem;color:#fff;letter-spacing:-0.02em}
    .section-header p{color:var(--text-dim);font-size:1.125rem;max-width:650px;line-height:1.6}

    .principle-section{padding:6rem 1.5rem;background:var(--bg);border-top:1px solid var(--border)}
    .principle-content{max-width:900px;margin:0 auto}
    .principle-accent{width:80px;height:3px;background:linear-gradient(90deg,var(--teal),#14b8a6);border-radius:2px;margin-bottom:2rem}
    .principle-text{font-size:clamp(1.125rem,2vw,1.35rem);line-height:1.7;color:var(--text-dim);font-weight:400}
    .principle-text strong{color:var(--teal);font-weight:600}
    .principle-meta{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;gap:2rem;flex-wrap:wrap}
    .principle-meta span{font-size:.875rem;color:var(--text-muted);font-family:monospace}
    .principle-meta strong{color:var(--text-dim);font-weight:600}

    .blackbox-section{padding:6rem 1.5rem;background:#09090b;border-top:1px solid var(--border)}
    .blackbox-header{max-width:800px;margin:0 auto 3rem;padding:0 1.5rem}
    .blackbox-header h2{font-size:clamp(1.75rem,4vw,2.5rem);font-weight:700;margin-bottom:1rem;color:#fff;letter-spacing:-0.02em}
    .blackbox-header p{color:var(--text-dim);font-size:1.125rem;line-height:1.6}
    .blackbox-container{position:relative;max-width:700px;margin:0 auto;background:#000;border:1px solid var(--border);border-radius:1rem;aspect-ratio:16/9;overflow:hidden;cursor:pointer;transition:border-color .4s;display:flex;align-items:center;justify-content:center}
    .blackbox-container:hover{border-color:rgba(45,212,191,0.25)}
    .blackbox-overlay{text-align:center;transition:opacity .8s cubic-bezier(0.16,1,0.3,1)}
    .blackbox-overlay h3{font-size:1.5rem;font-weight:700;margin-bottom:.5rem;color:#fff}
    .blackbox-overlay p{color:var(--text-muted);font-size:.875rem}
    .blackbox-container:hover .blackbox-overlay{opacity:.08}
    .blackbox-layers{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;opacity:0;transition:opacity .6s .15s}
    .blackbox-container:hover .blackbox-layers{opacity:1}
    .bb-layer{border:1px solid rgba(45,212,191,0.25);color:var(--teal);padding:.875rem 2rem;border-radius:.5rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8125rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:0;transform:translateY(12px);transition:all .5s cubic-bezier(0.16,1,0.3,1)}
    .blackbox-container:hover .bb-layer{opacity:1;transform:translateY(0)}
    .bb-layer:nth-child(1){transition-delay:.25s}
    .bb-layer:nth-child(2){transition-delay:.45s}
    .bb-layer:nth-child(3){transition-delay:.65s}

    .pillars-section{padding:5rem 1.5rem;background:var(--bg);border-top:1px solid var(--border)}
    .pillars-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;max-width:1200px;margin:0 auto}
    .pillar-card{background:var(--card);border:1px solid rgba(45,212,191,0.1);border-radius:1rem;padding:2.5rem;position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
    .pillar-card:hover{border-color:rgba(45,212,191,0.25);transform:translateY(-4px)}
    .pillar-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),#14b8a6);opacity:0;transition:opacity .3s}
    .pillar-card:hover::before{opacity:1}
    .pillar-number{position:absolute;top:1.25rem;right:1.5rem;font-size:3rem;font-weight:900;color:rgba(255,255,255,0.03);line-height:1;font-variant-numeric:tabular-nums}
    .pillar-label{color:var(--teal);font-family:monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem}
    .pillar-card h3{font-size:1.125rem;font-weight:700;margin-bottom:.75rem;color:#fff;letter-spacing:-0.01em}
    .pillar-card p{color:var(--text-dim);font-size:.9375rem;line-height:1.6}

    .critical-section{padding:5rem 1.5rem;background:#09090b;border-top:1px solid var(--border)}
    .critical-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;max-width:1200px;margin:0 auto}
    .critical-item{background:linear-gradient(90deg,rgba(45,212,191,0.03),transparent);border-left:2px solid rgba(45,212,191,0.2);padding:2rem 1.5rem;border-radius:0 .75rem .75rem 0;transition:border-color .3s,transform .3s}
    .critical-item:hover{border-left-color:var(--teal);transform:translateX(4px)}
    .critical-item h4{font-size:1.125rem;font-weight:700;margin-bottom:.75rem;color:#fff}
    .critical-item p{color:var(--text-dim);font-size:.9375rem;line-height:1.6}

    .ops-section{padding:5rem 1.5rem;background:var(--bg);border-top:1px solid var(--border)}
    .timeline{max-width:800px;margin:0 auto;padding-left:2.5rem;position:relative}
    .timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--teal),rgba(45,212,191,0.1));border-radius:1px}
    .timeline-item{position:relative;padding-bottom:3rem}
    .timeline-item:last-child{padding-bottom:0}
    .timeline-item::before{content:'';position:absolute;left:-2.5rem;top:.35rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--teal);transform:translateX(-7px);transition:background .3s,box-shadow .3s}
    .timeline-item:hover::before{background:var(--teal);box-shadow:0 0 20px rgba(45,212,191,0.3)}
    .timeline-item h4{font-size:1.25rem;font-weight:700;margin-bottom:.75rem;color:#fff;letter-spacing:-0.01em}
    .timeline-item p{color:var(--text-dim);font-size:1rem;line-height:1.7;max-width:600px}

    .resources-section{padding:5rem 1.5rem;background:#09090b;border-top:1px solid var(--border)}
    .resources-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;max-width:1200px;margin:0 auto}
    .resource-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:2.5rem;text-decoration:none;color:inherit;transition:all .3s;position:relative}
    .resource-card:hover{border-color:rgba(45,212,191,0.25);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
    .resource-card .tag{display:inline-block;padding:.35rem .9rem;border-radius:999px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1.25rem;background:rgba(45,212,191,0.08);color:var(--teal);border:1px solid rgba(45,212,191,0.15)}
    .resource-card h3{font-size:1.35rem;font-weight:700;margin-bottom:.75rem;color:#fff;letter-spacing:-0.01em}
    .resource-card p{color:var(--text-dim);font-size:.9375rem;line-height:1.6}
    .resource-card::after{content:'→';position:absolute;top:2.5rem;right:2.5rem;font-size:1.25rem;color:var(--text-muted);transition:transform .3s,color .3s}
    .resource-card:hover::after{transform:translateX(4px);color:var(--teal)}

    .site-footer{background:#000;border-top:1px solid var(--border);padding:4rem 1.5rem 3rem}
    .footer-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2.5rem}
    .footer-col .footer-heading{color:var(--teal);font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem}
    .footer-col ul{list-style:none;padding:0;margin:0}
    .footer-col li{margin-bottom:.5rem}
    .footer-col a{color:var(--text-dim);font-size:.875rem;display:block;transition:color .2s}
    .footer-col a:hover{color:var(--teal)}
    .footer-bottom{max-width:1200px;margin:2.5rem auto 0;padding-top:2rem;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;font-size:.75rem;color:var(--text-muted)}
    .footer-bottom a{color:var(--teal)}
    .footer-tagline{max-width:1200px;margin:0 auto 2.5rem;text-align:center}
    .footer-tagline p{font-size:1.125rem;color:#fff;font-weight:600;margin-bottom:.5rem;letter-spacing:-0.01em}
    .footer-tagline span{color:var(--text-muted);font-size:.875rem}
    .footer-logo{max-width:1200px;margin:0 auto 2rem;text-align:center}
    .footer-logo img{max-width:260px;height:auto;opacity:.85;transition:opacity .3s}
    .footer-logo img:hover{opacity:1}

@media(max-width:768px){
      .critical-grid,.resources-grid,.spec-grid,.role-grid{grid-template-columns:1fr}
      .pillars-grid{grid-template-columns:1fr}
      .blackbox-layers{flex-direction:column;gap:.75rem}
      .bb-layer{width:80%;text-align:center}
      .footer-grid{grid-template-columns:repeat(2,1fr)}
      .footer-bottom{flex-direction:column;align-items:center;text-align:center}
      .principle-meta{gap:1rem}
    }
    @media(max-width:600px){
      .hero-title{font-size:2.5rem}
      .footer-grid{grid-template-columns:1fr}
    }

    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    /* Accessibility: links in text blocks must not rely on color alone */
    p a, li a, .principle-text a, .charter-block a, .step-card p a, .verification-box a, details p a{text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(45,212,191,0.4)}
    p a:hover, li a:hover, .principle-text a:hover, .charter-block a:hover, .step-card p a:hover, .verification-box a:hover, details p a:hover{text-decoration-color:var(--teal)}
    .nav-links a, .nav-logo, .role-card a, .matrix-link a, .resource-card, .footer-col a, .footer-col .footer-heading, .btn, .skip-link, .hero-buttons a, .next-steps a, .pillar-card a, .critical-item a, .timeline-item a, .blackbox-container a{text-decoration:none}
</style>
